{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

<div class="page-inner">
    <div class="page-header">
        <h4 class="page-title">Fire Incidents Map</h4>
        <ul class="breadcrumbs">
            <li class="nav-home">
                <a href="{% url 'dashboard-chart' %}">
                    <i class="flaticon-home"></i>
                </a>
            </li>
            <li class="separator">
                <i class="flaticon-right-arrow"></i>
            </li>
            <li class="nav-item">
                <a href="#">Maps</a>
            </li>
            <li class="separator">
                <i class="flaticon-right-arrow"></i>
            </li>
            <li class="nav-item">
                <a href="#">Incidents</a>
            </li>
        </ul>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card card-transparent">
                <div class="card-header">
                    <h4 class="card-title text-center">Fire Incidents</h4>
                    <p class="card-category text-center">
                        Looks great on any resolution. Made by our
                        friends from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
                    </p>
                </div>
                <div class="card-body">
                    <div class="col-md-10 ml-auto mr-auto">
                        <!-- Dropdown for city filtering -->
                        <div class="form-group">
                            <label for="cityFilter">Filter by Location:</label>
                            <select id="cityFilter" class="form-control">
                                <option value="">Show All</option>
                                <option value="San Luis">San Luis</option>
                                <option value="Tubao">Tubao</option>
                                <option value="Sicsican">Sicsican</option>
                            </select>
                        </div>
                        <div id="map" style="width: 100%; height: 400px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([9.79084079537797, 118.74201169654], 13);

    var fireIcon = L.icon({
        iconUrl: "{% static 'img/fire.jpg' %}",
        iconSize: [50, 50],
    });

    var truckIcon = L.icon({
        iconUrl: "{% static 'img/fire-truck-3.png' %}",
        iconSize: [40, 40],
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    var markers = [];
    var truckMarkers = [];
    var markerData = [
        {
            latitude: 9.79084079537797,
            longitude: 118.74201169654,
            name: "San Luis",
            address: "Near San Luis, La Union National High School"
        },
        {
            latitude: 9.82084079537797,
            longitude: 118.74201169655,
            name: "Tubao",
            address: "Near Tubao Elementary School"
        },
        {
            latitude: 9.79555573875096,
            longitude: 118.718565836493,
            name: "Sicsican",
            address: "Near Sicsican Elementary"
        }
    ];

    var truckData = markerData.map(item => ({
        ...item,
        name: `Fire Truck - ${item.name}`,
        latitude: parseFloat(item.latitude) + 0.001, // Slightly offset to avoid overlap
        longitude: parseFloat(item.longitude) + 0.001
    }));

    // Add markers to the map
    function addMarkers(data) {
        // Clear existing markers
        markers.forEach(marker => map.removeLayer(marker));
        truckMarkers.forEach(marker => map.removeLayer(marker));
        markers = [];
        truckMarkers = [];

        // Add fire incident markers
        data.forEach(function (item) {
            var latitude = parseFloat(item.latitude);
            var longitude = parseFloat(item.longitude);
            var marker = L.marker([latitude, longitude], { icon: fireIcon }).addTo(map);
            marker.bindPopup(`<b>${item.name}</b><br>${item.address}`);
            markers.push(marker);

            // Add corresponding truck marker
            var truckLat = latitude + 0.001;
            var truckLng = longitude + 0.001;
            var truckMarker = L.marker([truckLat, truckLng], { icon: truckIcon }).addTo(map);
            truckMarker.bindPopup(`<b>Fire Truck</b><br>Assigned to ${item.name}`);
            truckMarkers.push(truckMarker);
        });
    }

    // Initial marker population
    addMarkers(markerData);

    // Filter functionality
    document.getElementById('cityFilter').addEventListener('change', function () {
        var selectedCity = this.value;
        if (selectedCity) {
            var filteredData = markerData.filter(function (item) {
                return item.name === selectedCity;
            });
            addMarkers(filteredData);
        } else {
            addMarkers(markerData);
        }
    });
</script>
{% endblock %}

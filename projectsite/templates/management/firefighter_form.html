{% extends 'base.html' %}

{% block content %}
<div class="page-inner">
    <div class="page-header">
        <h4 class="page-title">{% if firefighter %}Edit{% else %}Add New{% endif %} Firefighter</h4>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Firefighter Details</div>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" class="form-control" name="name" value="{{ firefighter.name|default:'' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Badge Number</label>
                            <input type="text" class="form-control" name="badge_number" value="{{ firefighter.badge_number|default:'' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Position</label>
                            <input type="text" class="form-control" name="position" value="{{ firefighter.position|default:'' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Station</label>
                            <select class="form-control" name="station" required>
                                {% for station in stations %}
                                    <option value="{{ station.id }}" {% if firefighter.station.id == station.id %}selected{% endif %}>
                                        {{ station.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="card-action">
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="{% url 'firefighter-list' %}" class="btn btn-danger">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

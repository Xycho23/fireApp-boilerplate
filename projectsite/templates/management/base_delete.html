{% extends 'base.html' %}

{% block content %}
<div class="page-inner">
    <div class="page-header">
        <h4 class="page-title">Confirm Delete</h4>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">{% block delete_title %}{% endblock %}</h4>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        <p>{% block delete_message %}{% endblock %}</p>
                    </div>
                    <div class="card-action">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% block cancel_url %}{% endblock %}" class="btn btn-default">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

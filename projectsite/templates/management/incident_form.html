{% extends 'base.html' %}

{% block content %}
<div class="page-inner">
    <div class="page-header">
        <h4 class="page-title">{% if incident %}Edit{% else %}Add New{% endif %} Fire Incident</h4>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Incident Details</div>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="form-group">
                            <label>Location</label>
                            <select class="form-control" name="location" required>
                                {% for location in locations %}
                                <option value="{{ location.id }}" {% if incident.location_id == location.id %}selected{% endif %}>
                                    {{ location.address }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Severity</label>
                            <select class="form-control" name="severity" required>
                                <option value="LOW" {% if incident.severity == 'LOW' %}selected{% endif %}>Low</option>
                                <option value="MEDIUM" {% if incident.severity == 'MEDIUM' %}selected{% endif %}>Medium</option>
                                <option value="HIGH" {% if incident.severity == 'HIGH' %}selected{% endif %}>High</option>
                                <option value="CRITICAL" {% if incident.severity == 'CRITICAL' %}selected{% endif %}>Critical</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" name="description" rows="3" required>{{ incident.description|default:'' }}</textarea>
                        </div>
                    </div>
                    <div class="card-action">
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="{% url 'incident-list' %}" class="btn btn-danger">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="page-inner">
    <div class="page-header">
        <h4 class="page-title">{% if location %}Edit{% else %}Add New{% endif %} Location</h4>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Location Details</div>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" class="form-control" name="address" value="{{ location.address|default:'' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Latitude</label>
                            <input type="number" step="any" class="form-control" name="latitude" value="{{ location.latitude|default:'' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Longitude</label>
                            <input type="number" step="any" class="form-control" name="longitude" value="{{ location.longitude|default:'' }}" required>
                        </div>
                    </div>
                    <div class="card-action">
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="{% url 'location-list' %}" class="btn btn-danger">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

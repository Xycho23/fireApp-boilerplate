{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="card-title">{% if station %}Edit{% else %}Add{% endif %} Fire Station</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" value="{{ station.name|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <select class="form-control" name="location" required>
                        {% for location in locations %}
                            <option value="{{ location.pk }}" {% if station.location.pk == location.pk %}selected{% endif %}>
                                {{ location.address }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" class="form-control" name="contact_number" value="{{ station.contact_number|default:'' }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'firestation-list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Weather Data</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'weather:list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
